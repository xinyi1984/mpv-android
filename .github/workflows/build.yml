name: build

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
  pull_request:
    branches:
      - fongmi

env:
  MPV_GIT_URL: https://github.com/FongMi/mpv
  MPV_GIT_REF: fongmi
  MPV_ANDROID_ARCHES: armv7l arm64

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/mpv-android-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build cmake python3-pip gperf
          sudo pip3 install meson
      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ runner.temp }}/mpv-android-cache"

      - name: Build native libraries
        env:
          MPV_ANDROID_NATIVE_ONLY: "1"
        run: |
          buildscripts/include/ci.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-fongmi
          path: app/src/main/libs/**/*.so
          if-no-files-found: error
      
      - name: 推送 so 到 tv fongmi 分支
        run: |
          set -e
          echo "克隆 tv 仓库 (fongmi 分支)..."
          git clone --depth 2 --branch fongmi \
            "https://${{ secrets.PUSH_TOKEN }}@github.com/xinyi1984/tv.git" \
            tv_repo || { echo "❌ 克隆失败"; exit 1; }
          # 确保目标目录存在并清空旧文件
          rm -rf tv_repo/app/src/main/jniLibs
          mkdir -p tv_repo/app/src/main/jniLibs
          # 复制本次构建的 .so 文件
          cp -r app/src/main/libs/* tv_repo/app/src/main/jniLibs/ 2>/dev/null || true
          cd tv_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git add app/src/main/jniLibs/ && git commit -m "Update mpv so"; then
            echo "有变更，准备推送..."
            git fetch origin fongmi --force
            if git push origin fongmi --force-with-lease; then
              echo "✅ 推送成功（force-with-lease）"
            else
              echo "⚠️ 推送失败，尝试强制推送..."
              git push origin fongmi --force
            fi
          else
            echo "ℹ️ 无变更，跳过提交"
          fi
          cd ..
          rm -rf tv_repo
          echo "✅ .so 推送完成"
